<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Redirecting...</title>
<script>
(function(){
  var seg = window.location.pathname.replace('/hic', '').replace(/^\//, '').replace(/\/$/, '');
  var pages = ['haberlerim','perspektif','vodcast','podcast','hayatim','hakkimda'];
  
  if(seg === 'about.html' || seg === 'about') {
    var lang = new URLSearchParams(window.location.search).get('lang') || 'en';
    // about.html should be served directly - if 404, it means the file is missing
    // Redirect to index with a flag to show about
    window.location.replace('/hic/index.html?goto=profile&lang=' + lang);
  } else if(pages.indexOf(seg) >= 0) {
    window.location.replace('/hic/index.html#' + seg);
  } else {
    window.location.replace('/hic/index.html');
  }
})();
</script>
</head>
<body></body>
</html>
